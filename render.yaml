# Blueprint de Render — «Bot Profit Orituco» (Gigadevs Corp). Dashboard → New → Blueprint → este repositorio.
# Seguridad: la base de datos y la pasarela de WhatsApp NO tienen acceso desde Internet (solo la red privada de Render);
# las claves de la app las genera Render (nadie las ve ni viajan por el repositorio); solo se piden el usuario y el correo del Maestro.
projects:
  - name: Bot Profit Orituco
    environments:
      - name: produccion
        services:
          # ------------------------------------------------------------- app web (clientes + consola Maestro + API del conector)
          - type: web
            name: bot-profit-orituco
            runtime: python
            plan: starter
            region: ohio
            buildCommand: pip install -r requirements.txt
            preDeployCommand: python inicializar.py
            startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 60 --forwarded-allow-ips="*"
            healthCheckPath: /salud
            envVars:
              - key: PYTHON_VERSION
                value: 3.12.7
              - key: FLASK_ENV
                value: production
              - key: SECRET_KEY
                generateValue: true
              - key: FIELD_ENCRYPTION_KEY        # cifra en reposo los secretos de MFA, WhatsApp y del conector. NO la cambie después
                generateValue: true
              - key: DATABASE_URL
                fromDatabase:
                  name: bot-profit-db
                  property: connectionString
              - key: OPENWA_URL                  # pasarela PROPIA por la red privada (host:puerto)
                fromService:
                  type: pserv
                  name: bot-whatsapp
                  property: hostport
              - key: MAESTRO_USUARIO             # su usuario de Gigadevs: el enlace de activación sale en el log del primer despliegue
                sync: false
              - key: MAESTRO_EMAIL
                sync: false

          # ------------------------------------------------------------- pasarela de WhatsApp PROPIA (OpenWA), privada
          # Sin URL pública: la app le habla por la red interna. Una sesión por empresa, vinculada por QR. Motor Baileys.
          # La clave de administrador sale en su primer log y en /app/data/.api-key: el Maestro la pega en Consola → Pasarela de WhatsApp.
          # Imagen fijada por digest (la versión probada en Contax); para actualizar, cambie el digest a propósito.
          - type: pserv
            name: bot-whatsapp
            runtime: image
            image:
              url: ghcr.io/rmyndharis/openwa@sha256:1a2d0c393a7c8a629b0b18cdb5125d9be59192480c02d56a022c249a66af9068
            plan: starter
            region: ohio
            disk:                                # sesiones vinculadas: sobreviven a reinicios y despliegues
              name: bot-whatsapp-datos
              mountPath: /app/data
              sizeGB: 1
            envVars:
              - key: NODE_ENV
                value: production
              - key: PORT
                value: "2785"
              - key: ENGINE_TYPE
                value: baileys
              - key: RESOLVE_LID_TO_PHONE
                value: "true"
              - key: SERVE_DASHBOARD               # solo API: el panel web de OpenWA no se expone
                value: "false"

        databases:
          - name: bot-profit-db
            plan: basic-256mb
            region: ohio
            databaseName: bot_profit
            user: bot_profit
            postgresMajorVersion: "16"
            ipAllowList: []                      # sin acceso desde Internet
